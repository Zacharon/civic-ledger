name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full-history secret scan (VC-067). gitleaks-action limits push and pull_request scans
  # to `--no-merges --first-parent base^..head` (8 commits, then 0), so the MIT-licensed
  # gitleaks CLI runs directly: no license key, no secret, no PR comments. With no
  # --log-opts, `gitleaks git` scans `git log -p --full-history --all`, i.e. every commit
  # on every ref that checkout fetched (fetch-depth 0: all branches and tags).
  # The version and its SHA-256 are pinned by hand; Dependabot does not update them.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Scan the full git history
        run: |
          echo "Commits on all fetched refs: $(git rev-list --all --count)"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose --exit-code 1 --log-level info .

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Any production finding fails; the dev tree fails on high or critical (DECISIONS A48).
      - run: pnpm audit --prod
      - run: pnpm audit --audit-level=high

  # The same suite as `pnpm test:pg`, against a real postgres:17 service (DECISIONS A40).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pg

  # Playwright: AI-free workflows, axe, keyboard, URL state, before-hydration actions,
  # UI = /api/v1 = MCP on one Postgres (shared-values), then the performance budget.
  # `test:e2e` builds first; each Next server seeds its own throwaway PGlite.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # shared-values.spec.ts creates its own database here instead of an embedded Postgres.
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @civic-ledger/web exec playwright install --with-deps chromium
      - name: Seed check (fictional dev data, PGlite)
        run: pnpm db:seed
      - run: pnpm --filter @civic-ledger/web test:e2e
      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 7

  # Run the previous real app against today's migrated DB, and parse today's legacy
  # API payloads using the previous app's actual output schemas. New capabilities
  # naturally disappear on rollback; that is not transparent to clients using them.
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: 1
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
      ROLLBACK_BASELINE_ROOT: ${{ github.workspace }}/rollback-baseline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: 8ff55923e486271130557791a457f1c1a13e71a0
          path: rollback-baseline
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: rollback-baseline
      - run: pnpm --filter @civic-ledger/web build
      - run: pnpm --filter @civic-ledger/web build
        working-directory: rollback-baseline
      - run: pnpm --filter @civic-ledger/web exec playwright install --with-deps chromium
      - run: pnpm --filter @civic-ledger/web exec playwright test --config playwright.rollback.config.ts
