name: Scheduled public-data ingest
on:
  workflow_dispatch:
    inputs:
      schedule:
        type: choice
        options: [daily, weekly]
        default: daily
  schedule:
    - cron: '41 0 * * *'
    - cron: '41 1 * * 6'
permissions:
  contents: read
concurrency:
  group: civic-ledger-production-ops
  cancel-in-progress: false
jobs:
  ingest:
    if: vars.CIVIC_DEPLOYMENT_ENABLED == 'true' && vars.CIVIC_INGEST_ENABLED == 'true'
    environment: civic-ledger-operations
    runs-on: [self-hosted, civic-ledger-ops]
    timeout-minutes: 110
    env:
      CIVIC_DEPLOYMENT_ENABLED: ${{ vars.CIVIC_DEPLOYMENT_ENABLED }}
      CIVIC_CONGRESS: ${{ vars.CIVIC_CONGRESS }}
      CIVIC_CYCLE: ${{ vars.CIVIC_CYCLE }}
      CIVIC_RAW_ROOT: ${{ vars.CIVIC_RAW_ROOT }}
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      DB_POOL_MAX: 3
      INGEST_RUN_DEADLINE_MS: 2700000
      INGEST_MAX_DELETE_FRACTION: 0.1
      INGEST_MIN_RECORD_RATIO: 0.5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ingest through existing operator command
        env:
          SCHEDULE_KIND: ${{ github.event.inputs.schedule || (github.event.schedule == '41 1 * * 6' && 'weekly' || 'daily') }}
        run: pnpm exec tsx scripts/monitor/ingest-runner.ts --schedule "$SCHEDULE_KIND"
      # No migration, seed, --force-replay or --allow-shrink in unattended work.
