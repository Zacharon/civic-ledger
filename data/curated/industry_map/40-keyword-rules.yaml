# Generic keyword rules, applied after FEC codes and named organizations. A keyword says
# what a sponsor does ("BANKERS", "HOSPITAL"), so confidence is lower (0.7). Labor and
# public-employee words run first so, e.g., "United Food and Commercial Workers" is coded
# as labor, not food. A committee no rule matches stays "not coded": never guessed.
schema_version: 1
